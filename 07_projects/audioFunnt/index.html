<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bmi calculator demo</title>
     
</head>
<style>

    body{
    background: linear-gradient(to bottom right, #38A2D7, #561139);
}

.container{
    margin: 0;
    height: 100vh;
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid;
    border-radius: 5px;
}
</style>
<body>
    
        <div class="container">
            <h1> BMI CALCULATOR </h1>
         
            <span >Height in cm :
                <input type="text" class="height">  
            </span>
            <br> </br>
            <span >Weight in kg :
                <input type="text" class="weight">  
            </span>
            <br> </br>
            <button type="submit" id="calculate"  >Calculate</button>

            <div class="weight-guide">
                <h3> bmi weigth guide</h3>
                <p>under weight = less than 18.6</p>
                <p>Normal weight =  18.6 to 24.9</p>
                <p>Overweight weight =  greater than 24.9</p>
            </div>
            <div class="result"></div>
        </div>

</body>
<script>
    const calculate=document.querySelector('#calculate')

calculate.addEventListener('click',function(event){
    const audioFaah = new Audio()
    audioFaah.src="faaah.mp3"

    const happyaudio = new Audio()
    happyaudio.src = "happy-happy-happy-cat.mp3 "

    const fartaudio = new Audio()
    fartaudio.src="auuuughhh-reverse.mp3"

    const meriJungaudio = new Audio()
    meriJungaudio.src="meri-jung-emotional.mp3"


    
   
    event.preventDefault();
    const height =parseInt (document.querySelector('.height').value)
    console.log(height);

    const weight = parseInt (document.querySelector('.weight').value)
    event.target

    const result = document.querySelector('.result')

    if(height===null||isNaN(height)||height<0){
        result.innerHTML= ` ${height} is not a valid height `
        audioFaah.play()

    }

    else if(weight===null||isNaN(weight)||weight<0){
        result.innerHTML =` ${weight} is not a valid weight `
        audioFaah.play()
    }

    else{
        const  bmi =  (weight / ((height*height)/10000)).toFixed(2)
        result.innerHTML = ` your bmi is ${bmi}`

            if(bmi<=18.6){
                result.innerHTML = ` you are under weight `
                result.innerHTML = ` your bmi is ${bmi}`
                meriJungaudio.play();
            }
             else if(bmi<24.6){
                result.innerHTML = ` you are normal weight `
                result.innerHTML = ` your bmi is ${bmi}`
                happyaudio.play();
             }
             else{
                result.innerHTML = ` your bmi is ${bmi} you are FAAAAAAAATTTTTTTT `
                fartaudio.play();
             }
        
    }
})
</script>
</html>
