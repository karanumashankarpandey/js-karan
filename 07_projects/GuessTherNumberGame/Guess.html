<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number game</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <div class="wrapper">
        <h1>number guessing game</h1>
        <p> guess the number between 1 to 100</p>
        <p>you have 10 attempts to guess the number</p>
        <br> </br>

        <form class="form">
            <label for="guessField" id="guess">guess the number</label>
            <br> 
            <input type="text" id="guessField" class="guessField" >
                <br>
            <input type="submit" id="subt" value="submit guess" >
           
        </form>
        
        <div class="resultParas">
            <p>Previous Guess: <span class="guesses"></span>  </p>
            <p> Guess Remaining: <span class="Remaining">10</span>  </p>
            <p class="lowORhigh"></p>
        </div>

    </div>

    <script src="guess.js"></script>    


</body>
</html>
